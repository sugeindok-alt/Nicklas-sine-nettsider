name: DuelZone checks
on:
  push:
    paths: ['duelzone/**', '.github/workflows/duelzone.yml']
  pull_request:
    paths: ['duelzone/**', '.github/workflows/duelzone.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: duelzone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: duelzone/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:integration
      - run: npm run test:live
      - run: npm run test:experience
      - run: npm run test:social
      - run: npm run test:frontier
      - run: npm run test:platform
      - run: npm run test:evolution
